<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="NEON SIEGE  Arena Survival">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="50%" stop-color="#0b0520"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0077">
        <animate attributeName="stop-color" values="#ff0077;#00f0ff;#39ff14;#ff0077" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#39ff14;#ff0077;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#ff0077;#00f0ff;#39ff14" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <g opacity="0.35">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 24; 0 0" dur="4s" repeatCount="indefinite"/>
      <line x1="0" y1="40" x2="1200" y2="40" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
      <line x1="0" y1="88" x2="1200" y2="88" stroke="#ff0077" stroke-width="1" opacity="0.18"/>
      <line x1="0" y1="136" x2="1200" y2="136" stroke="#39ff14" stroke-width="1" opacity="0.12"/>
      <line x1="0" y1="184" x2="1200" y2="184" stroke="#00f0ff" stroke-width="1" opacity="0.18"/>
      <line x1="0" y1="232" x2="1200" y2="232" stroke="#ff0077" stroke-width="1" opacity="0.2"/>
    </g>
  </g>

  <rect x="18" y="18" width="1164" height="244" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.55" rx="8">
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="28" y="28" width="1144" height="224" fill="none" stroke="#ff0077" stroke-width="1" opacity="0.4" rx="6"/>

  <text x="600" y="128" text-anchor="middle" font-family="Orbitron, Audiowide, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="14" fill="url(#titleGrad)" filter="url(#softGlow)">NEON SIEGE</text>
  <text x="600" y="128" text-anchor="middle" font-family="Orbitron, Audiowide, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="14" fill="none" stroke="#00f0ff" stroke-width="1.4" opacity="0.85">NEON SIEGE</text>

  <text x="600" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="22" letter-spacing="10" fill="#39ff14" filter="url(#glow)">ARENA SURVIVAL</text>

  <text x="600" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#c8facc">
    ARAM DOMINGUEZ RIVERA  ·  SAUL AZOLA HUERTA  ·  DAW
  </text>

  <circle cx="90" cy="140" r="6" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="cy" values="90;190;90" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="140" r="6" fill="#ff0077" filter="url(#glow)">
    <animate attributeName="cy" values="190;90;190" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
